<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Apex Fitness</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

        *, body { font-family: 'Inter', sans-serif; }

        .profile-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #080808 0%, #121212 60%, #1a0505 100%);
            padding: 120px 20px 60px;
        }

        .profile-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            max-width: 520px;
            margin: 0 auto;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .profile-avatar {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, #ff3b3b, #cc0000);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
            color: white;
            box-shadow: 0 0 0 4px rgba(255,59,59,0.2), 0 8px 32px rgba(255,0,0,0.3);
        }

        .profile-info {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-info h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: white;
            font-weight: 700;
        }

        .profile-info p {
            color: #b3b3b3;
            margin: 5px 0;
        }

        .profile-details {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-item:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #808080;
            font-size: 0.9rem;
        }

        .detail-value {
            color: white;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-primary-custom {
            flex: 1;
            background: white;
            color: black;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary-custom:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .btn-logout {
            flex: 1;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.5);
        }

        .membership-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff0000, #cc0000);
            color: white;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .dashboard-sections {
            display: grid;
            gap: 24px;
            margin-top: 32px;
        }

        .dashboard-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            color: white;
        }

        .dashboard-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .dashboard-card-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .dashboard-card-title i {
            font-size: 1.4rem;
            color: #ff3b3b;
        }

        /* Admin quick-create forms (profile) */
        .admin-create-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 8px;
        }

        .admin-form-panel {
            border: 1px solid rgba(232, 255, 0, 0.15);
            background: linear-gradient(165deg, rgba(20, 20, 20, 0.95), rgba(12, 12, 12, 0.88));
        }

        .admin-form-title-row {
            align-items: flex-start;
            gap: 14px;
        }

        .admin-form-icon {
            font-size: 1.75rem;
            color: #e8ff00;
            margin-top: 2px;
        }

        .admin-form-heading-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .admin-form-heading {
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: #fff;
        }

        .admin-form-subtitle {
            margin: 0;
            font-size: 0.82rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.35;
        }

        .admin-form-fields .detail-item {
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            padding: 14px 0;
        }

        .admin-form-fields .detail-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
        }

        .admin-form-fields .form-control,
        .admin-form-fields select.form-control {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f5f5f5;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 0.95rem;
        }

        .admin-form-fields .form-control:focus,
        .admin-form-fields select.form-control:focus {
            border-color: rgba(232, 255, 0, 0.45);
            box-shadow: 0 0 0 2px rgba(232, 255, 0, 0.12);
            outline: none;
        }

        .admin-form-fields .form-control::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .admin-form-actions {
            padding-top: 8px;
        }

        .admin-form-actions .action-link {
            width: 100%;
            text-align: center;
            justify-content: center;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(232, 255, 0, 0.35);
            color: #e8ff00;
            font-weight: 700;
        }

        .admin-form-actions .action-link:hover {
            background: rgba(232, 255, 0, 0.1);
        }

        .admin-msg {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.88rem;
            line-height: 1.35;
        }

        .admin-msg.error {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fecaca;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .status-badge.success { background: #0f9d58; color: white; }
        .status-badge.info { background: #1e88e5; color: white; }
        .status-badge.warning { background: #fbbc04; color: black; }
        .status-badge.danger { background: #d93025; color: white; }
        .status-badge.primary { background: #5c6ac4; color: white; }
        .status-badge.secondary { background: rgba(255,255,255,0.08); color: white; }

        .table-dashboard {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .table-dashboard th,
        .table-dashboard td {
            padding: 14px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            color: #e5e5e5;
            text-align: left;
        }

        .table-dashboard th {
            color: #c7c7c7;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .table-dashboard tbody tr:hover {
            background: rgba(255,255,255,0.05);
        }

        .action-link {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.18);
            color: white;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .action-link:hover {
            background: rgba(255,255,255,0.08);
        }

        .empty-state {
            color: #b3b3b3;
            padding: 20px 0;
            font-size: 0.95rem;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            color: #b3b3b3;
        }

        .not-logged-in {
            text-align: center;
            padding: 60px 20px;
        }

        .not-logged-in h2 {
            color: white;
            margin-bottom: 20px;
        }

        .not-logged-in p {
            color: #b3b3b3;
            margin-bottom: 30px;
        }

        .nav-breadcrumb {
            margin-bottom: 30px;
        }

        .nav-breadcrumb a {
            color: #ff0000;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-breadcrumb a:hover {
            text-decoration: underline;
        }
        /* ── Admin stat grid ── */
        .admin-stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 14px;
            margin: 4px 0 4px;
        }
        .admin-stat-card {
            background: linear-gradient(135deg, rgba(255,59,59,0.10), rgba(255,59,59,0.03));
            border: 1px solid rgba(255,59,59,0.18);
            border-radius: 14px;
            padding: 20px 14px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .admin-stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(255,59,59,0.18); }
        .admin-stat-icon { font-size: 1.7rem; color: #ff3b3b; margin-bottom: 8px; }
        .admin-stat-value { font-size: 1.9rem; font-weight: 800; color: white; line-height: 1; margin-bottom: 5px; }
        .admin-stat-label { font-size: 0.73rem; color: #777; text-transform: uppercase; letter-spacing: 0.07em; }

        /* ── Form groups ── */
        .form-section { display: flex; flex-direction: column; gap: 0; }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .form-group:last-of-type { border-bottom: none; }
        .form-group label {
            color: #777;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }
        .form-control {
            background: rgba(255,255,255,0.06) !important;
            border: 1px solid rgba(255,255,255,0.1) !important;
            border-radius: 8px !important;
            color: white !important;
            padding: 10px 14px !important;
            font-size: 0.92rem !important;
            transition: border-color 0.2s, box-shadow 0.2s !important;
            width: 100%;
        }
        .form-control:focus {
            background: rgba(255,255,255,0.09) !important;
            border-color: rgba(255,59,59,0.55) !important;
            box-shadow: 0 0 0 3px rgba(255,59,59,0.13) !important;
            outline: none !important;
        }
        .form-control option { background: #1a1a1a; color: white; }
        .btn-admin-create {
            width: 100%;
            margin-top: 14px;
            background: linear-gradient(135deg, #ff3b3b, #c50000);
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 9px;
            font-weight: 700;
            font-size: 0.92rem;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.2s;
            text-transform: uppercase;
        }
        .btn-admin-create:hover { opacity: 0.88; transform: translateY(-1px); }
        .btn-admin-create:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
        .admin-msg {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.87rem;
            background: rgba(255,59,59,0.1);
            border: 1px solid rgba(255,59,59,0.3);
            color: #ff8888;
            display: none;
        }
        .admin-msg.visible { display: block; }
        .admin-msg.success { background: rgba(0,230,118,0.1); border-color: rgba(0,230,118,0.3); color: #00e676; }

        /* ── Dashboard cards ── */
        .dashboard-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            color: white;
        }
        .dashboard-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            flex-wrap: wrap;
            gap: 12px;
        }
        .dashboard-card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            color: white;
        }
        .dashboard-card-title i { font-size: 1.2rem; color: #ff3b3b; }

        /* ── Tables ── */
        .table-dashboard {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        .table-dashboard th {
            padding: 11px 12px;
            color: #888;
            font-size: 0.72rem;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            text-align: left;
        }
        .table-dashboard td {
            padding: 12px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #ddd;
        }
        .table-dashboard tbody tr:hover td { background: rgba(255,255,255,0.04); }
        .btn-table-action {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.14);
            color: white;
            padding: 5px 11px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.78rem;
            transition: background 0.2s;
            margin-right: 4px;
            font-weight: 500;
        }
        .btn-table-action:hover { background: rgba(255,255,255,0.15); }
        .btn-table-action.danger:hover { background: rgba(255,59,59,0.2); border-color: rgba(255,59,59,0.4); }

        /* ── Status badges ── */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .status-badge.success  { background: rgba(0,200,100,0.15);  color: #00e676; border: 1px solid rgba(0,200,100,0.3); }
        .status-badge.danger   { background: rgba(255,59,59,0.15);   color: #ff6b6b; border: 1px solid rgba(255,59,59,0.3); }
        .status-badge.info     { background: rgba(30,136,229,0.15);   color: #64b5f6; border: 1px solid rgba(30,136,229,0.3); }
        .status-badge.warning  { background: rgba(251,188,4,0.15);    color: #ffd54f; border: 1px solid rgba(251,188,4,0.3); }
        .status-badge.primary  { background: rgba(92,106,196,0.15);   color: #9fa8da; border: 1px solid rgba(92,106,196,0.3); }
        .status-badge.secondary{ background: rgba(255,255,255,0.07);  color: #aaa;    border: 1px solid rgba(255,255,255,0.12); }

        /* ── Other profile styles ── */
        .profile-info { text-align: center; margin-bottom: 36px; }
        .profile-info h1 { font-size: 26px; margin-bottom: 8px; color: white; font-weight: 800; }
        .profile-info p { color: #b3b3b3; margin: 4px 0; }
        .profile-details { background: rgba(255,255,255,0.02); border-radius: 10px; padding: 16px; margin-bottom: 24px; }
        .detail-item { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .detail-item:last-child { border-bottom: none; }
        .detail-label { color: #777; font-size: 0.85rem; }
        .detail-value { color: white; font-weight: 600; font-size: 0.92rem; }
        .action-buttons { display: flex; gap: 12px; }
        .btn-primary-custom {
            flex: 1;
            background: linear-gradient(135deg, #ff3b3b, #cc0000);
            color: white;
            border: none;
            padding: 13px 24px;
            border-radius: 9px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.92rem;
        }
        .btn-primary-custom:hover { opacity: 0.88; transform: translateY(-2px); color: white; }
        .btn-logout {
            flex: 1;
            background: rgba(255,255,255,0.07);
            color: white;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 13px 24px;
            border-radius: 9px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-logout:hover { background: rgba(255,59,59,0.15); border-color: rgba(255,59,59,0.4); }
        .membership-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff3b3b, #cc0000);
            color: white;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-top: 10px;
            letter-spacing: 0.04em;
        }
        .dashboard-sections { display: grid; gap: 22px; margin-top: 32px; }
        .empty-state { color: #666; padding: 20px 0; font-size: 0.92rem; }
        .loading-spinner { display: none; text-align: center; color: #b3b3b3; padding: 40px; }
        .not-logged-in { text-align: center; padding: 60px 20px; }
        .not-logged-in h2 { color: white; margin-bottom: 16px; }
        .not-logged-in p { color: #b3b3b3; margin-bottom: 28px; }
        .nav-breadcrumb { margin-bottom: 28px; }
        .nav-breadcrumb a { color: #ff3b3b; text-decoration: none; font-size: 0.88rem; display: flex; align-items: center; gap: 6px; }
        .nav-breadcrumb a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <nav class="d-flex align-items-center justify-content-between" style="height: 64px;">
                <a href="index.html" class="d-flex align-items-center gap-3 text-decoration-none">
                    <img src="images/logo-red.png" alt="Apex" class="logo">
                    <span class="text-white fs-5 tracking-tighter" style="font-family: 'Syncopate', sans-serif; font-weight: 700;">APEX.</span>
                </a>
                <div class="d-none d-md-flex align-items-center gap-4">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="index.html#about" class="nav-link">About</a>
                    <div class="lang-dropdown">
                        <button class="nav-link lang-btn border-0 bg-transparent">EN</button>
                        <div class="lang-dropdown-menu">
                            <button class="lang-dropdown-item lang-option active" data-lang="en">English</button>
                            <div class="lang-dropdown-divider"></div>
                            <button class="lang-dropdown-item lang-option" data-lang="ar">العربية</button>
                        </div>
                    </div>
                    <div class="profile-dropdown-header" id="profileDropdownHeader" style="display: none; position: relative;">
                        <button class="profile-icon-btn" style="background: none; border: none; cursor: pointer; color: white; font-size: 20px;">
                            <i class="bi bi-person-circle"></i>
                        </button>
                        <div class="profile-dropdown-menu" style="display: none; position: absolute; top: 100%; right: 0; background: rgba(0, 0, 0, 0.95); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; min-width: 200px; z-index: 1000;">
                            <a href="profile.html" style="display: block; padding: 12px 20px; color: white; text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">My Profile</a>
                            <button id="logoutBtn" style="display: block; width: 100%; padding: 12px 20px; background: none; border: none; color: #ff0000; text-align: left; cursor: pointer; font-size: 0.9rem;">Logout</button>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <div class="profile-container">
        <div class="container">
            <div class="nav-breadcrumb">
                <a href="index.html"><i class="bi bi-chevron-left"></i> Back to Home</a>
            </div>

            <div id="loadingSpinner" class="loading-spinner">
                <p>Loading profile...</p>
            </div>

            <div id="notLoggedIn" class="not-logged-in" style="display: none;">
                <h2>Access Denied</h2>
                <p>You need to be logged in to view this page.</p>
                <a href="login.html" class="btn btn-primary-custom" style="max-width: 200px; margin: 0 auto;">
                    <i class="bi bi-box-arrow-in-right"></i> Go to Login
                </a>
            </div>

            <div id="profileContent" style="display: none;">
                <div class="profile-card">
                    <div class="profile-avatar" style="overflow:hidden;">
                        <img id="profileAvatarImg" alt="Profile" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />
                    </div>

                    <div class="profile-info">
                        <h1 id="userName">User Name</h1>
                        <p id="userRole" style="color: #ff0000; font-weight: 600;">MEMBER</p>
                        <span class="membership-badge" id="membershipStatus">Active Member</span>
                    </div>

                    <div class="profile-details">
                        <div class="detail-item">
                            <span class="detail-label">Email Address</span>
